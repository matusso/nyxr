name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v0.1.0 or v0.2.0-rc1" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: make package VERSION="$TAG"
      - uses: actions/upload-artifact@v5
        with:
          name: nyxr-${{ env.TAG }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/SHA256SUMS \
              --title "$TAG" --generate-notes --verify-tag $prerelease
          fi
      - name: Update Homebrew formula
        if: ${{ !contains(env.TAG, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B formula origin/main
          scripts/homebrew-formula.sh "$TAG" dist/SHA256SUMS > Formula/nyxr.rb
          if git diff --quiet -- Formula/nyxr.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "brew: nyxr ${TAG#v}" -- Formula/nyxr.rb
          git push origin HEAD:main
          git checkout --detach "$TAG"
      - name: Update Homebrew tap
        if: ${{ !contains(env.TAG, '-') }}
        env:
          # SSH private key of a write deploy key on matusso/homebrew-tap.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set, skipping matusso/homebrew-tap"
            exit 0
          fi
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 git@github.com:matusso/homebrew-tap.git "$tap"
          mkdir -p "$tap/Formula"
          scripts/homebrew-formula.sh "$TAG" dist/SHA256SUMS > "$tap/Formula/nyxr.rb"
          cd "$tap"
          if git diff --quiet -- Formula/nyxr.rb && git ls-files --error-unmatch Formula/nyxr.rb >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nyxr.rb
          git commit -m "nyxr $TAG"
          git push origin HEAD:main
      - name: Set image tags
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$image:$TAG"
            if [[ "$TAG" != *-* ]]; then echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ env.TAG }}
            SOURCE=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=nyxr
          cache-to: type=gha,mode=max,scope=nyxr
