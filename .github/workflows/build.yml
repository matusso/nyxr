name: build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: make fuzz
      - run: make package
      - name: Smoke test deb and rpm packages
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable sh -ec '
            apt-get update -qq && apt-get install -y -qq /dist/nyxr_*_amd64.deb
            nyxr version && nyxr-packetd --version && id nyxr
            apt-get remove -y -qq nyxr'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -ec '
            dnf install -y -q /dist/nyxr-*.x86_64.rpm
            nyxr version && nyxr-packetd --version && id nyxr
            dnf remove -y -q nyxr'
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nyxr:ci
          build-args: VERSION=ci
          cache-from: type=gha,scope=nyxr
          cache-to: type=gha,mode=max,scope=nyxr
      - name: Smoke test Docker image
        run: test "$(docker run --rm nyxr:ci version)" = ci
      - uses: actions/upload-artifact@v5
        with:
          name: nyxr-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
