name: build
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
