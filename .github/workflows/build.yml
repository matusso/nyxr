name: build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make check
      - run: make fuzz
      - run: make package
      - name: Build and smoke test Docker image
        run: |
          docker build --build-arg VERSION=ci -t nyxr:ci .
          test "$(docker run --rm nyxr:ci version)" = ci
      - uses: actions/upload-artifact@v5
        with:
          name: nyxr-packages
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
