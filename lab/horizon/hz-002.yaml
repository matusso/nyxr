# HZ-002 repeated SYN stability (A/A null control). Both arms send the same
# baseline SYN; arm order is the only difference. Interleaved reference probes
# measure environmental drift. Edit target/ports for an authorized lab.
apiVersion: horizon.nyxr.io/v1alpha2
kind: Experiment
metadata:
  name: hz-002-repeated-syn-stability
spec:
  scope:
    targets: ["192.0.2.10"]
    tcpPorts: [443]
  changedVariable: none
  confounders: [path-routing, remote-state-reuse]
  control:
    steps:
      - send: {protocol: tcp, flags: [SYN], dstPort: 443, optionsProfile: baseline}
      - observe: {windowMs: 100}
  treatment:
    steps:
      - send: {protocol: tcp, flags: [SYN], dstPort: 443, optionsProfile: baseline}
      - observe: {windowMs: 100}
  execution:
    replicates: 12
    randomizedOrder: true
    seed: 69002
    washoutMs: 100
    referenceEvery: 4
  limits:
    maxPackets: 54
    maxDurationSeconds: 90
    packetsPerSecond: 10
    maxConcurrentFlows: 1
    maxReceiveFrames: 64
    maxMemoryBytes: 2097152
  capture:
    maxBytes: 65536
